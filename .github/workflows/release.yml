name: Release desktop builds
run-name: Release ${{ inputs.tag || github.ref_name }}

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release
        required: true
        type: string

permissions:
  contents: write

jobs:
  macos:
    env:
      MACOSX_DEPLOYMENT_TARGET: '15.0'
    strategy:
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.tag || github.ref }}
      - run: brew install sdl2 sdl2_mixer mpv
      - run: ./scripts/package-macos.sh
      - name: Smoke-test bundled macOS player
        run: |
          app='dist/Celeste Classic.app'
          codesign --verify --deep --strict "$app"
          "$app/Contents/Resources/player/mpv" --no-config --vo=null --ao=null --frames=2 \
            "$app/Contents/Resources/records/any.mp4"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: macos-${{ matrix.arch }}-release
          path: dist/ccleste-macos-${{ matrix.arch }}.zip

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: msys2/setup-msys2@40677d36a502eb2cf0fb808cc9dec31bf6152638
        with:
          msystem: UCRT64
          update: true
          install: >-
            make
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-SDL2
            mingw-w64-ucrt-x86_64-SDL2_mixer
            mingw-w64-ucrt-x86_64-mpv
            zip
      - shell: msys2 {0}
        run: ./scripts/package-windows.sh
      - shell: pwsh
        run: |
          $extract = Join-Path $env:RUNNER_TEMP 'celeste-installer-smoke'
          Expand-Archive dist/ccleste-windows-installer.zip -DestinationPath $extract
          $payload = Join-Path $extract 'ccleste-windows-installer'
          & (Join-Path $payload 'Install-CelesteClassic.cmd')
          if ($LASTEXITCODE -ne 0) { throw 'Installer failed' }
          $installed = Join-Path ([Environment]::GetFolderPath('LocalApplicationData')) 'CelesteClassic'
          $shortcut = Join-Path ([Environment]::GetFolderPath('Programs')) 'Celeste Classic.lnk'
          if (-not (Test-Path -LiteralPath (Join-Path $installed 'ccleste.exe'))) { throw 'Game was not installed' }
          foreach ($relative in @('player\mpv.exe', 'player\README.md', 'records\any.mp4', 'records\all-berries.mp4')) {
            if (-not (Test-Path -LiteralPath (Join-Path $installed $relative))) { throw "Bundled media payload is missing: $relative" }
          }
          & (Join-Path $installed 'player\mpv.exe') --no-config --vo=null --ao=null --frames=2 (Join-Path $installed 'records\any.mp4')
          if ($LASTEXITCODE -ne 0) { throw 'Bundled player smoke test failed' }
          if (-not (Test-Path -LiteralPath $shortcut)) { throw 'Start menu shortcut was not created' }
          & (Join-Path $payload 'Install-CelesteClassic.cmd') -Force
          if ($LASTEXITCODE -ne 0) { throw 'Installer update failed' }
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File (Join-Path $installed 'Uninstall-CelesteClassic.ps1')
          if ($LASTEXITCODE -ne 0) { throw 'Uninstaller failed' }
          if ((Test-Path -LiteralPath $installed) -or (Test-Path -LiteralPath $shortcut)) { throw 'Uninstall did not remove installed files and shortcut' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-release
          path: |
            dist/ccleste-windows.zip
            dist/ccleste-windows-installer.zip

  publish:
    needs: [macos, windows]
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: release-assets
          merge-multiple: true
      - run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/*.zip --clobber
          else
            gh release create "$RELEASE_TAG" release-assets/*.zip --generate-notes
          fi
        env:
          GH_TOKEN: ${{ github.token }}
